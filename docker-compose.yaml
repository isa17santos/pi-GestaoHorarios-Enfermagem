services:

  # ========================
  # FRONTEND
  # ========================

  frontend:
    build: ./frontend-web
    container_name: gh_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  # ========================
  # BACKEND
  # ========================

  api:
    build: ./backend
    container_name: gh_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      - db
      - redis
      - mailpit

  queue-worker:
    build: ./backend
    container_name: gh_queue
    command: php artisan queue:work
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      - api
      - redis

  # ========================
  # DATABASE
  # ========================

  db:
    image: postgres:16
    container_name: gh_db
    environment:
      POSTGRES_DB: horarios
      POSTGRES_USER: horarios
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ========================
  # REDIS
  # ========================

  redis:
    image: redis:7-alpine
    container_name: gh_redis
    ports:
      - "6379:6379"

  # ========================
  # MAILPIT
  # ========================

  mailpit:
    image: axllent/mailpit:latest
    container_name: gh_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
  frontend_node_modules:
  backend_vendor: