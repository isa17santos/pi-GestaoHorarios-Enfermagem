info:
  name: 200PasswordReset
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/password-recovery/reset"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"token\" : \"{{password_reset_token}}\",\r

      \    \"email\": \"miguel.ferreira@example.pt\",\r

      \    \"password\": \"NovaPassword@123\",\r

      \    \"password_confirmation\": \"NovaPassword@123\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
